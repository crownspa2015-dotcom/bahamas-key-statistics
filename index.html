<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahamas — Key Statistics</title><style>
:root{
  --ink:#0b1b4c;
  --muted:#60708e;
  --line:#dce7f2;
  --card:#ffffff;
  --social:#eaf4ff;
  --economic:#e9f5ff;
  --env:#e8f8f5;
  --blue:#0d6fe8;
  --blue2:#67b8f5;
  --green:#18a48f;
  --green2:#7dd8c8;
}

*{box-sizing:border-box;min-width:0}

html,body{
  margin:0;
  max-width:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#ffffff;
}

.wrap{
  width:100%;
  max-width:none;
  margin:0;
  padding:16px 14px 28px;
  overflow-x:hidden;
}

/* ---------- HERO ---------- */

.hero{
  display:block;
  margin-bottom:16px;
}

.hero h1{
  font-size:42px;
  line-height:1.05;
  margin:6px 0 10px;
  color:#111f5a;
}

.hero p{
  font-size:16px;
  line-height:1.4;
  margin:0;
  color:#334a77;
  max-width:100%;
}


/* ---------- PILLARS ---------- */

.pillar{
  border-radius:16px;
  padding:12px;
  margin:16px 0;
}

.social{background:var(--social)}
.economic{background:var(--economic)}
.environment{background:var(--env)}

.pillar-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 4px 10px;
}

.badge{
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:24px;
  font-weight:bold;
  background:linear-gradient(135deg,#0878ef,#0a4da4);
  flex:0 0 auto;
}

.environment .badge{
  background:linear-gradient(135deg,#16a995,#087565);
}

.pillar-head h2{
  font-size:26px;
  margin:0;
  white-space:nowrap;
}

.tag{
  font-size:13px;
  color:#335987;
}

.strap{
  margin-left:auto;
  font-size:13px;
  color:#315a88;
  text-align:right;
  max-width:40%;
}

/* ---------- FLEXIBLE CARD GRID ---------- */
/* No forced 5-card layout. Cards expand naturally based on available width. */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:9px;
  width:100%;
}

.card{
  background:#fff;
  border:1px solid rgba(14,76,145,.08);
  border-radius:11px;
  min-height:124px;
  padding:12px;
  overflow:hidden;
  display:flex;
  gap:12px;
  align-items:flex-start;
  box-shadow:0 1px 0 rgba(10,36,95,.03);
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e8f3ff;
  font-size:21px;
  flex:0 0 auto;
}

.environment .icon{
  background:#dff3ee;
}

.card > div:last-child{
  flex:1 1 auto;
}

.label{
  font-size:12.5px;
  font-weight:700;
  line-height:1.22;
  margin-bottom:5px;
  overflow-wrap:anywhere;
}

.value{
  font-size:24px;
  font-weight:800;
  line-height:1.05;
  color:#0c1b57;
  overflow-wrap:anywhere;
}

.period{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
  line-height:1.25;
}

.meaning{
  font-size:11.5px;
  color:#284e7a;
  margin-top:6px;
  line-height:1.3;
  font-weight:600;
}

.card-source{
  font-size:10.5px;
  margin-top:7px;
  line-height:1.25;
}

.card-source a{
  color:#3d6592;
  text-decoration:underline;
  text-underline-offset:2px;
}

.card-source a:hover{
  color:#0d6fe8;
}

/* ---------- STORY VISUALS ---------- */

.visual-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  margin-top:10px;
  width:100%;
}

.chart-card,
.story-card{
  background:#fff;
  border:1px solid rgba(14,76,145,.08);
  border-radius:11px;
  padding:14px;
  overflow:hidden;
}

.chart-card h3,
.story-card h3{
  margin:0 0 4px;
  font-size:19px;
}

.chart-sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:12px;
  line-height:1.35;
}

.chart-source{
  margin-top:10px;
  font-size:11px;
}

.chart-source a{
  color:#3d6592;
  text-decoration:underline;
  text-underline-offset:2px;
}


.visual-stat-card{
  height:100%;
  min-height:100%;
  align-self:stretch;
  padding:20px;
}

.visual-stat-card .value{
  font-size:34px;
  margin-top:4px;
}

.visual-stat-card .meaning{
  margin-top:10px;
  max-width:420px;
}


/* ---------- DONUT ---------- */

.donut-wrap{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:22px;
  align-items:center;
  min-height:220px;
}

.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  position:relative;
  margin:auto;
  box-shadow:inset 0 0 0 1px rgba(11,27,76,.06);
}

.donut::after{
  content:"";
  position:absolute;
  inset:32px;
  background:#fff;
  border-radius:50%;
}

.donut-center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#233d70;
  pointer-events:none;
  padding:52px;
}

.legend{
  display:grid;
  gap:10px;
}

.legend-row{
  display:grid;
  grid-template-columns:14px 1fr auto;
  gap:8px;
  align-items:center;
  font-size:13px;
}

.swatch{
  width:12px;
  height:12px;
  border-radius:3px;
}

.legend-label{
  color:#425a7c;
}

.legend-value{
  font-weight:800;
  color:#0c1b57;
}

/* ---------- SOCIAL SNAPSHOT ---------- */

.note{
  background:rgba(255,255,255,.74);
  border-radius:11px;
  padding:16px;
  font-size:14px;
  line-height:1.45;
  color:#365270;
}

.snapshot-lines{
  display:grid;
  gap:12px;
  margin-top:12px;
}

.snapshot-line{
  padding-bottom:10px;
  border-bottom:1px solid #e8eef5;
}

.snapshot-line:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.snapshot-line strong{
  color:#132c63;
}

/* ---------- ENVIRONMENT HERO COMPARISON ---------- */

.ocean-comparison{
  margin-top:10px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
}

.compare-card{
  background:#fff;
  border:1px solid rgba(14,76,145,.08);
  border-radius:11px;
  padding:18px;
  text-align:center;
}

.compare-card .compare-label{
  font-size:12px;
  font-weight:700;
  color:#3f6283;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.compare-card .compare-value{
  font-size:34px;
  line-height:1;
  font-weight:800;
  color:#0c1b57;
  margin:8px 0 5px;
}

.compare-card .compare-note{
  font-size:12px;
  color:var(--muted);
}

.compare-story{
  grid-column:1 / -1;
  background:rgba(255,255,255,.74);
  border-radius:11px;
  padding:14px 16px;
  color:#365270;
  font-size:14px;
  line-height:1.45;
}


/* ---------- LINE CHARTS ---------- */

.line-chart{
  position:relative;
  height:250px;
  margin-top:8px;
  padding:12px 8px 34px 42px;
  border-left:1px solid #dbe5ef;
  border-bottom:1px solid #dbe5ef;
}

.line-chart svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.line-chart .grid{
  stroke:#e8eef5;
  stroke-width:1;
}

.line-chart .zero{
  stroke:#aebed0;
  stroke-width:1.3;
}

.line-chart .path{
  fill:none;
  stroke:#0d6fe8;
  stroke-width:3;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.line-chart .dot{
  fill:#ffffff;
  stroke:#0d6fe8;
  stroke-width:2;
}

.line-axis-label{
  font-size:10px;
  fill:#667892;
}

.line-y-label{
  position:absolute;
  left:0;
  font-size:10px;
  color:#667892;
}

.line-x-labels{
  display:grid;
  gap:0;
  margin:6px 0 0 42px;
  color:#667892;
  font-size:9px;
}

.line-x-labels span{
  text-align:center;
  white-space:nowrap;
  transform:rotate(-35deg);
  transform-origin:top center;
}

@media(max-width:760px){
  .line-chart{
    height:220px;
  }
  .line-x-labels{
    font-size:8px;
  }
}


/* ---------- FOOTER ---------- */

.sources{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  padding:16px 4px 0;
  font-size:13px;
  color:#4e6380;
  line-height:1.45;
}

.error{
  padding:20px;
  border:1px solid #e0a5a5;
  background:#fff6f6;
  border-radius:10px;
  color:#7b1e1e;
}

/* ---------- EMBED SAFETY ---------- */

html, body, #app, .wrap, .hero, .pillar, .pillar-head,
.cards, .card, .visual-grid, .chart-card, .story-card,
.sources, .ocean-comparison {
  max-width:100% !important;
  min-width:0 !important;
}

img,svg,canvas{
  max-width:100% !important;
}

.sources,.tag,.strap,.label,.period{
  overflow-wrap:anywhere;
}

body{
  overflow-x:hidden !important;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .visual-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:760px){
  .pillar-head{
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .strap{
    margin-left:64px;
    text-align:left;
    width:100%;
    max-width:none;
  }
  .donut-wrap{
    grid-template-columns:1fr;
  }
  .ocean-comparison{
    grid-template-columns:1fr;
  }
}

@media(max-width:560px){
  .wrap{
    padding:14px 10px;
  }
  .hero h1{
    font-size:34px;
  }
  .cards{
    grid-template-columns:1fr;
  }
  .value{
    font-size:27px;
  }
  .pillar-head h2{
    font-size:23px;
  }
}

function card(r){return `<article class="card" data-indicator="${esc(r.id)}"><div class="icon">${icon(r.icon)}</div><div><div class="label">${esc(r.label)}</div><div class="value">${esc(r.display)}</div><div class="period">${esc(r.period)}</div><div class="meaning">${esc(r.note)}</div>${ref(r)}</div></article>`;}
function pillar(cls,title,tag,strap,content){return `<section class="pillar ${cls}" aria-label="${title}"><div class="pillar-head"><div class="badge">${icon(cls==='social'?'people':cls==='economic'?'chart':'leaf')}</div><h2>${title}</h2><div class="tag">${tag}</div><div class="strap">${strap}</div></div><div class="dashboard-grid">${content}</div></section>`;}
document.getElementById('app').innerHTML=`<header class="hero"><div><h1>${esc(d.title)}</h1><p>People, economic dependence and island resilience</p><p>Population: ${esc(d.population.display)} · ${esc(d.population.period)} · <a href="${esc(d.population.source_url)}" target="_blank" rel="noopener noreferrer">BNSI census</a></p></div><div class="updated">Updated ${esc(d.updated)}</div></header>${pillar('social','SOCIAL','People and wellbeing','Settlement, work and health',d.social.map(card).join(''))}${pillar('economic','ECONOMIC','Economy and dependence','Tourism, trade, debt and prices',d.economic.map(card).join(''))}${pillar('environment','ENVIRONMENTAL','Environment and resilience','Energy transition, marine protection and disaster impacts',d.environment.map(card).join(''))}<footer class="sources">Reference periods differ and are shown on every card. Tourism and obesity refer to 2019; Dorian is a historical event. Preliminary results and estimates are labelled. B$ = Bahamian dollars; US$ = United States dollars.</footer>`;
</script></body></html>
